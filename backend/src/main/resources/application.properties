server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hms?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:hms}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.error.include-message=always
management.endpoints.web.exposure.include=health,info
hms.jwt.secret=${JWT_SECRET:}
hms.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
hms.upload.dir=${UPLOAD_DIR:./uploads}
